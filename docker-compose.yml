services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: carbonsite-backend
    env_file:
      - path: ./.env.docker
        required: false
      - path: ./backend/.env
        required: false
    ports:
      - "3000:3000"
    environment:
      PORT: ${BACKEND_PORT:-3000}
      NODE_ENV: ${BACKEND_NODE_ENV:-development}
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: carbonsite-frontend
    depends_on:
      - backend
    env_file:
      - path: ./.env.docker
        required: false
    ports:
      - "4200:4200"
    environment:
      CHOKIDAR_USEPOLLING: "true"
      NG_CLI_ANALYTICS: "false"
    volumes:
      - ./frontend:/app
      - /app/node_modules
