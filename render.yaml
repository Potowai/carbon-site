# Render.com configuration for deployment optimizations
# Place in root of project or in frontend directory

services:
  - type: web
    name: carbonsite-frontend
    runtime: static
    region: oregon
    plan: free
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_OPTIONS
        value: "--max-old-space-size=256"
    buildCommand: "cd frontend && npm ci --only=production && npm run build"
    staticPublishPath: ./frontend/dist/frontend
